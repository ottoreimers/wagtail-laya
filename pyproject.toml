[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wagtail-laya"
version = "0.1.0"
description = "Tag and rate Wagtail pages with Laya, a local open-source decision model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Otto Reimers", email = "otto.reimers@frojd.se" },
    { name = "Andreas Bernacca", email = "andreas.bernacca@frojd.se" },
]
classifiers = [
    "Framework :: Django",
    "Framework :: Wagtail",
    "Framework :: Wagtail :: 7",
    "Framework :: Wagtail :: 8",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "wagtail>=6.3",
]

[project.optional-dependencies]
local = ["laya>=0.3.20"]
test = ["pytest", "pytest-django"]

[tool.hatch.build.targets.wheel]
packages = ["src/wagtail_laya"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
